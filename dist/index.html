<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet DataPlay</title>
    
    <meta name="description" content="Projet pour visualiser les liens entre les tops 10 du nombres de votes par live action chaque année depuis 2000.">
    <meta property="og:site_name" content="Visualisation des liens entre les films">
    <meta property="og:title" content="DataPlay">
    <meta property="og:description" content="DataPlay">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://anhelinamoroziuk.be/projets/dataplay">
    <meta property="og:image" content="images/share-image.jpg"> 
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

  <link rel="stylesheet" href="styles/app.css">
  <script src="scripts/app.js" defer></script>
</head>
<body>




  <header class="hero">
    <div class="hero__logo-container">
      <img src="assets/images/logo.svg" alt="REMATCH-REWATCH" class="hero__logo">
    </div>
    

    <p class="hero__text">Votre site idéal pour visualiser les liens entre les tops 10 du nombres
     de votes par live action chaque année depuis 2000.</p>

    
      <nav class="hero__nav selector">
          <ul class="selector__list">
            <li class="selector__item selector__item--active">ACTEUR</li>
            <li class="selector__item">GENRE</li>
            <li class="selector__item">ANNEE</li>
          </ul>
      </nav>
  </header>


<main class="main">

<section id="section-genre">

  <section class="main__filters">
    <div class="select__element">
      <select class="select__list">

      <option value="" disabled selected>Choisir un genre dominant</option>
        <option class="select__item" value="action">Action</option>
         <option class="select__item" value="drame">Drame</option>
          <option class="select__item" value="comedie">Comédie</option>
            <option class="select__item" value="thriller">Thriller</option>
          </select> 
          <button class="main__reset">Réinitialiser</button>
     </div>
     </section>
 

 <section class="content">
  
    <div class="content__years content__years--left">
      <div class="years__list">
        <div class="years__item">2001</div>
        <div class="years__item">2002</div>
        <div class="years__item">2003</div>
        <div class="years__item">2004</div>
      </div>

      <div class="years__text">
        <h3 class="years__text--content">Les années où le plus de films du genre dominant sont sortis.</h3>
      </div>
  </div>
 
    <div class="acteur__content acteur__content--right">

     <div class="acteur__text">
       <h3 class="acteur__text--content">Les acteurs qui ont le plus joués dans le genre dominant.</h3>
     </div>

     <div class="acteur__content acteur__content--right">
        <div>
          <img src="assets/images/millie-bobby-brown.svg" alt="millie-bobby-brown"></div>

        <div>
          <img src="assets/images/acteur.svg" alt="acteur"> </div>

        <div>
          <img src="assets/images/actrice.svg" alt="actrice"></div>

        <div>
          <img src="assets/images/avteur-2.svg" alt="acteur"> </div>
    </div>
  
</section>
</section>


<section id="section-acteur">
  <section class="main__filters">
    <div>
      <label>Chercher un acteur ...</label>
      <input type="text" id="search-actor">
      <button class="main__reset">Réinitialiser</button>
    </div>
  </section>




</section>




</main>


<section class="logo"> 
    <div class="logo-container">
      <img src="assets/images/logo.svg" alt="REMATCH-REWATCH" class="logo-container--towards">
    </div>
</section>


 




















</body>
</html>
